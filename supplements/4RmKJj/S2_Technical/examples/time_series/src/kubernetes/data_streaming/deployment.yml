apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-streaming-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-streaming
  template:
    metadata:
      labels:
        app: data-streaming
    spec:
      containers:
      - name: data-streaming
        image: <DOCKER-IMAGE>
        ports:
        - containerPort: 5020

---
apiVersion: v1
kind: Service
metadata:
  name: data-streaming-service
spec:
  type: LoadBalancer
  ports:
  - protocol: TCP
    port: 5020
    targetPort: 5020
    nodePort: 32044
  selector:
    app: data-streaming
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xai-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xai-serving
  template:
    metadata:
      labels:
        app: xai-serving
    spec:
      containers:
      - name: xai-serving
        image: <DOCKER-IMAGE>
        ports:
        - containerPort: 8040

---
apiVersion: v1
kind: Service
metadata:
  name: xai-serving
spec:
  type: LoadBalancer
  ports:
  - protocol: TCP
    port: 8040
    targetPort: 8040
    nodePort: 32049
  selector:
    app: xai-serving
name: Feature form regression
on:
  push:
    paths: ['feature_model.fm', 'html_generation.py', 'reproduction/ui-audit/**', '.github/workflows/feature-ui-regression.yml']
  pull_request:
    paths: ['feature_model.fm', 'html_generation.py', 'reproduction/ui-audit/**', '.github/workflows/feature-ui-regression.yml']
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: node reproduction/ui-audit/test_dependencies.cjs
